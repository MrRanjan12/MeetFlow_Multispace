services:
  # Backend FastAPI Service (Web Service)
  - type: web
    name: meeting-app-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: meeting-app-db
          property: connectionString
      - key: FRONTEND_ORIGINS
        value: https://meeting-app-frontend.onrender.com,http://localhost:5173

  # Frontend React Vite App (Static Site)
  - type: web
    name: meeting-app-frontend
    env: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: meeting-app-backend
          property: host

databases:
  # Managed PostgreSQL for persistent meetings & users
  - name: meeting-app-db
    plan: free
