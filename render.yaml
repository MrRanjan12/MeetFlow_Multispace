services:
  # Backend FastAPI Service (Web Service)
  - type: web
    name: meeting-app-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: meeting-app-db
          property: connectionString
      - key: FRONTEND_ORIGINS
        value: https://meeting-app-frontend-reqh.onrender.com,http://localhost:5173

  # Frontend React Vite App (Static Site)
  - type: web
    name: meeting-app-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_API_URL
        value: https://meeting-app-backend-4fu8.onrender.com

databases:
  # Managed PostgreSQL for persistent meetings & users
  - name: meeting-app-db
    plan: free
